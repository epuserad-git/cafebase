<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopi Catat</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#241b16;--mute:#7a6a5f;--line:#ece3d9;--brand:#6f4e37;--brand2:#b98a5e;--soft:#f3e9df;--ok:#2e7d4f;--bad:#c0392b;--warn:#d98a00;--side:#2b1f19;--shadow:0 1px 2px rgba(43,31,25,.05),0 4px 14px rgba(43,31,25,.06)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{display:flex;min-height:100vh}
.side{width:232px;background:var(--side);color:#e9dfd5;display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{font-size:19px;font-weight:700;padding:6px 10px 18px;color:#fff}
.brand small{display:block;font-size:11px;font-weight:500;color:#b9a898;margin-top:2px}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#cdbfb2;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
#nav button i{font-style:normal;font-size:17px;width:22px;text-align:center}
#nav button:hover{background:rgba(255,255,255,.07)}
#nav button.on{background:var(--brand2);color:#fff}
.side-foot{margin-top:auto;font-size:11px;color:#9c8b7c;padding:10px}
.content{flex:1;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 24px 14px;background:var(--bg);position:sticky;top:0;z-index:5}
.topbar h1{margin:0;font-size:22px}
.topbar small{color:var(--mute);font-size:13px}
main{max-width:1120px;margin:0 auto;padding:0 24px 32px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid.two>.card{margin-bottom:0}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand2);outline-offset:-1px}
.btn{background:var(--brand);color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;display:inline-block}
.btn.alt{background:#fff;color:var(--brand);border:1px solid var(--brand)}
label.btn{font-size:14px;margin:0;color:var(--brand)}
button.del{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px}
.row-end{display:flex;align-items:flex-end}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mute);font-weight:600}
tr:hover td{background:#fbf8f4}
td.r,th.r{text-align:right}
.wrap{overflow-x:auto}
.stat{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
.stat .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--soft);flex-shrink:0}
.stat span{font-size:12px;color:var(--mute);font-weight:600}
.stat b{display:block;font-size:20px;margin-top:1px}
.stat em{font-style:normal;font-size:12px;color:var(--mute)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.low{background:#fdecea;color:var(--bad)}.tag.good{background:#e6f4ea;color:var(--ok)}
.empty{color:var(--mute);text-align:center;padding:16px;font-size:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.bar>div{flex:1;min-width:140px}
.chart{display:flex;align-items:flex-end;gap:3px;height:180px;padding-top:8px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%;min-width:0}
.chart .col i{flex:1;border-radius:3px 3px 0 0}
.chart .a{background:var(--brand)}.chart .b{background:#e0c3a6}
.axis{display:flex;gap:3px;font-size:10px;color:var(--mute);margin-top:4px}
.axis span{flex:1;text-align:center;overflow:hidden;min-height:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hb{margin:10px 0}
.hb .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.hb .track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.hb .fill{height:100%;background:var(--brand2);border-radius:99px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:#fff;border:1px solid var(--line);cursor:pointer;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.err{color:var(--bad)}
.code{background:#2b1f19;color:#f1e6da;border-radius:10px;padding:12px;font-size:12px;overflow:auto;white-space:pre;margin:8px 0}
ol.steps{padding-left:20px;margin:0;font-size:14px;line-height:1.7}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b211b;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
@media(max-width:820px){
  .app{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px;z-index:20;box-shadow:0 -2px 12px rgba(0,0,0,.25)}
  .brand,.side-foot{display:none}
  #nav{flex-direction:row;overflow-x:auto;width:100%;gap:2px}
  #nav button{flex-direction:column;gap:2px;padding:6px 10px;min-width:70px;font-size:11px;align-items:center;text-align:center}
  #nav button i{font-size:19px}
  .topbar{padding:14px 14px 10px}
  .topbar h1{font-size:19px}
  main{padding:0 14px 96px}
  .toast{bottom:84px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">☕ Kopi Catat<small>Pencatatan coffee shop</small></div>
    <nav id="nav">
      <button data-t="laporan" class="on"><i>📊</i><span>Dashboard</span></button>
      <button data-t="jual"><i>🧾</i><span>Penjualan</span></button>
      <button data-t="online"><i>🛵</i><span>Online</span></button>
      <button data-t="menu"><i>📖</i><span>Menu</span></button>
      <button data-t="stok"><i>📦</i><span>Stok</span></button>
      <button data-t="member"><i>⭐</i><span>Member</span></button>
      <button data-t="absen"><i>🕒</i><span>Absensi</span></button>
      <button data-t="keluar"><i>💸</i><span>Pengeluaran</span></button>
      <button data-t="tutup"><i>🔒</i><span>Tutup Kasir</span></button>
      <button data-t="setting"><i>⚙️</i><span>Pengaturan</span></button>
    </nav>
    <div class="side-foot">Data tersimpan di browser ini. Backup rutin dari Dashboard.</div>
  </aside>
  <div class="content">
    <div class="topbar"><h1 id="ptitle">Dashboard</h1><div style="display:flex;gap:10px;align-items:center"><span class="chip" id="sbchip" onclick="goTab('setting')"></span><small id="hdate"></small></div></div>
    <main id="app"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'kopicatat_v1';
const empty = () => ({ stok: [], gerak: [], jual: [], keluar: [], menu: [], member: [], karyawan: [], absen: [], online: [], tutup: [] });
let db;
try { db = Object.assign(empty(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { db = empty(); }
const save = () => { localStorage.setItem(KEY, JSON.stringify(db)); queueSync(); };

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const num = n => (+n || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => d ? d.split('-').reverse().join('/') : '';
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1600); }

let tab = 'laporan';
let bulan = today().slice(0, 7);
const CATS = ['Bahan Baku', 'Gaji', 'Sewa', 'Listrik/Air', 'Peralatan', 'Lainnya'];
const BAYAR = ['Tunai', 'QRIS', 'Transfer'];
const PLATFORM = ['GoFood', 'GrabFood', 'ShopeeFood', 'Lainnya'];
const STATUS_ON = ['Diterima', 'Selesai', 'Batal'];
const POIN_PER = 10000; // 1 poin tiap Rp10.000

$('#hdate').textContent = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  tab = b.dataset.t;
  $('#ptitle').textContent = b.querySelector('span').textContent;
  window.scrollTo(0, 0);
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

const stokNow = id => db.gerak.filter(g => g.itemId === id).reduce((s, g) => s + (g.tipe === 'masuk' ? g.qty : -g.qty), 0);
const inMonth = r => r.tgl.slice(0, 7) === bulan;
const monthPicker = () => `<div><label>Bulan</label><input type="month" value="${bulan}" onchange="bulan=this.value||bulan;render()"></div>`;

function render() {
  $('#app').innerHTML = { laporan: vLaporan, jual: vJual, online: vOnline, menu: vMenu, stok: vStok, member: vMember, absen: vAbsen, keluar: vKeluar, tutup: vTutup, setting: vSetting }[tab]();
}

/* ---------- DASHBOARD ---------- */
function hbars(entries, fmt) {
  const max = Math.max(...entries.map(e => e[1]), 1);
  return entries.map(([n, v]) => `<div class="hb"><div class="t"><span>${esc(n)}</span><b>${fmt(v)}</b></div><div class="track"><div class="fill" style="width:${Math.max(3, v / max * 100)}%"></div></div></div>`).join('');
}
function vLaporan() {
  const j = db.jual.filter(inMonth), k = db.keluar.filter(inMonth);
  const on = db.online.filter(o => inMonth(o) && o.status === 'Selesai');
  const omzetOn = on.reduce((s, o) => s + o.qty * o.harga, 0);
  const fee = on.reduce((s, o) => s + o.qty * o.harga * (o.fee || 0) / 100, 0);
  const omzet = j.reduce((s, x) => s + x.qty * x.harga, 0) + omzetOn;
  const out = k.reduce((s, x) => s + x.jumlah, 0) + fee;
  const laba = omzet - out;
  const margin = omzet ? Math.round(laba / omzet * 100) + '% margin' : 'belum ada omzet';
  const byMenu = {};
  [...j, ...on].forEach(x => { const m = byMenu[x.menu.toLowerCase()] ||= { nama: x.menu, qty: 0, total: 0 }; m.qty += x.qty; m.total += x.qty * x.harga; });
  const top = Object.values(byMenu).sort((a, b) => b.qty - a.qty).slice(0, 5);
  const byCat = {}; k.forEach(x => byCat[x.kategori] = (byCat[x.kategori] || 0) + x.jumlah);
  if (fee) byCat['Potongan Platform'] = fee;
  const byPay = {}; j.forEach(x => byPay[x.bayar] = (byPay[x.bayar] || 0) + x.qty * x.harga);
  if (omzetOn) byPay['Online'] = (byPay['Online'] || 0) + omzetOn;
  const low = db.stok.filter(s => stokNow(s.id) <= s.min);
  const byLaba = {};
  [...j, ...on].forEach(x => { const m = byLaba[x.menu.toLowerCase()] ||= { nama: x.menu, total: 0, hpp: 0 }; m.total += x.qty * x.harga; m.hpp += hppOf(x) * x.qty; });
  const allLaba = Object.values(byLaba).map(m => ({ ...m, laba: m.total - m.hpp }));
  const labaMenu = allLaba.slice().sort((a, b) => b.laba - a.laba).slice(0, 5);
  const hppTotal = allLaba.reduce((s, m) => s + m.hpp, 0), labaTotalMenu = allLaba.reduce((s, m) => s + m.laba, 0);
  const tanpaHpp = allLaba.some(m => m.hpp === 0);
  const hariIni = db.jual.filter(x => x.tgl === today()).reduce((s, x) => s + x.qty * x.harga, 0)
    + db.online.filter(o => o.tgl === today() && o.status === 'Selesai').reduce((s, o) => s + o.qty * o.harga, 0);

  // grafik harian
  const [Y, M] = bulan.split('-').map(Number), days = new Date(Y, M, 0).getDate();
  const dIn = new Array(days).fill(0), dOut = new Array(days).fill(0), di = t => +t.slice(8, 10) - 1;
  j.forEach(x => dIn[di(x.tgl)] += x.qty * x.harga);
  on.forEach(o => { dIn[di(o.tgl)] += o.qty * o.harga; dOut[di(o.tgl)] += o.qty * o.harga * (o.fee || 0) / 100; });
  k.forEach(x => dOut[di(x.tgl)] += x.jumlah);
  const mx = Math.max(...dIn, ...dOut, 1);
  const chart = dIn.map((v, i) => `<div class="col" title="Tgl ${i + 1}: omzet ${rp(v)}, keluar ${rp(dOut[i])}"><i class="a" style="height:${v / mx * 100}%"></i><i class="b" style="height:${dOut[i] / mx * 100}%"></i></div>`).join('');
  const axis = dIn.map((_, i) => `<span>${i === 0 || (i + 1) % 5 === 0 ? i + 1 : ''}</span>`).join('');

  return `
  <div class="bar">${monthPicker()}
    <div><button class="btn alt" onclick="exportCSV()">Ekspor CSV</button></div>
    <div><button class="btn alt" onclick="backup()">Backup</button></div>
    <div><label class="btn alt" for="rs" style="cursor:pointer">Restore</label><input id="rs" type="file" accept=".json" hidden onchange="restore(this)"></div>
  </div>
  <div class="grid" style="margin-bottom:16px">
    <div class="stat"><div class="ic">💰</div><div><span>Omzet</span><b>${rp(omzet)}</b><em>${j.length + on.length} transaksi</em></div></div>
    <div class="stat"><div class="ic">🧾</div><div><span>Pengeluaran</span><b>${rp(out)}</b><em>termasuk potongan platform</em></div></div>
    <div class="stat"><div class="ic">${laba >= 0 ? '📈' : '📉'}</div><div><span>Laba kasar</span><b class="${laba >= 0 ? 'ok' : 'bad'}">${rp(laba)}</b><em>${margin}</em></div></div>
    <div class="stat"><div class="ic">☀️</div><div><span>Omzet hari ini</span><b>${rp(hariIni)}</b><em>${fmtDate(today())}</em></div></div>
    <div class="stat"><div class="ic">🧮</div><div><span>Laba menu (omzet − HPP)</span><b class="${labaTotalMenu >= 0 ? 'ok' : 'bad'}">${rp(labaTotalMenu)}</b><em>HPP ${rp(hppTotal)}</em></div></div>
  </div>
  <div class="card"><h2>Omzet vs pengeluaran harian</h2>
    <div class="legend"><span><i style="background:var(--brand)"></i>Omzet</span><span><i style="background:#e0c3a6"></i>Pengeluaran</span></div>
    ${omzet || out ? `<div class="chart">${chart}</div><div class="axis">${axis}</div>` : '<div class="empty">Belum ada data bulan ini</div>'}
  </div>
  <div class="grid two">
    <div class="card"><h2>Menu terlaris</h2>${top.length ? hbars(top.map(m => [`${m.nama} · ${num(m.qty)}x`, m.total]), rp) : '<div class="empty">Belum ada penjualan</div>'}</div>
    <div class="card"><h2>Metode pembayaran</h2>${Object.keys(byPay).length ? hbars(Object.entries(byPay), rp) : '<div class="empty">Kosong</div>'}</div>
    <div class="card"><h2>Pengeluaran per kategori</h2>${Object.keys(byCat).length ? hbars(Object.entries(byCat), rp) : '<div class="empty">Kosong</div>'}</div>
    <div class="card"><h2>Laba per menu (estimasi)</h2>${labaMenu.length ? hbars(labaMenu.map(m => [`${m.nama} · margin ${m.total ? Math.round(m.laba / m.total * 100) : 0}%`, m.laba]), rp) + (tanpaHpp ? '<p style="font-size:12px;color:var(--mute);margin:8px 0 0">Menu tanpa resep atau harga bahan dihitung HPP Rp 0.</p>' : '') : '<div class="empty">Belum ada penjualan</div>'}</div>
    <div class="card"><h2>⚠️ Stok menipis</h2>${low.length ? `<table>${low.map(s => `<tr><td>${esc(s.nama)}</td><td class="r bad">${num(stokNow(s.id))} ${esc(s.satuan)} <span style="color:var(--mute)">(min ${num(s.min)})</span></td></tr>`).join('')}</table>` : '<div class="empty">Semua stok aman</div>'}</div>
  </div>`;
}

/* ---------- PENJUALAN ---------- */
function vJual() {
  const list = db.jual.filter(inMonth).sort((a, b) => b.tgl.localeCompare(a.tgl) || b.id.localeCompare(a.id));
  const total = list.reduce((s, x) => s + x.qty * x.harga, 0);
  const menus = [...new Set([...db.menu.map(m => m.nama), ...db.jual.map(x => x.menu)])];
  return `
  <div class="card"><h2>Catat penjualan</h2>
    <form onsubmit="addJual(event)"><div class="grid">
      <div><label>Tanggal</label><input type="date" name="tgl" value="${today()}" required></div>
      <div><label>Menu</label><input name="menu" list="menus" placeholder="Es Kopi Susu" oninput="fillHarga(this)" required></div>
      <div><label>Jumlah</label><input type="number" name="qty" min="1" step="1" value="1" required></div>
      <div><label>Harga satuan</label><input type="number" name="harga" min="0" step="500" required></div>
      <div><label>Bayar</label><select name="bayar">${BAYAR.map(b => `<option>${b}</option>`).join('')}</select></div>
      <div><label>Member (opsional)</label><select name="memberId"><option value="">-</option>${db.member.map(m => `<option value="${m.id}">${esc(m.nama)}</option>`).join('')}</select></div>
      <div class="row-end"><button class="btn" style="width:100%">Simpan</button></div>
    </div><datalist id="menus">${menus.map(m => `<option value="${esc(m)}">`).join('')}</datalist></form>
  </div>
  <div class="bar">${monthPicker()}<div><b>Total: ${rp(total)}</b></div></div>
  <div class="card wrap">${list.length ? `<table><tr><th>Tgl</th><th>Menu</th><th class="r">Qty</th><th class="r">Harga</th><th class="r">Total</th><th>Bayar</th><th></th></tr>
  ${list.map(x => `<tr><td>${fmtDate(x.tgl)}</td><td>${esc(x.menu)}</td><td class="r">${num(x.qty)}</td><td class="r">${rp(x.harga)}</td><td class="r">${rp(x.qty * x.harga)}</td><td>${esc(x.bayar)}${x.memberId ? ' · ' + esc(memberName(x.memberId)) : ''}</td><td><button class="del" onclick="del('jual','${x.id}')">Hapus</button></td></tr>`).join('')}</table>` : '<div class="empty">Belum ada data bulan ini</div>'}</div>`;
}
function addJual(e) {
  e.preventDefault(); const f = new FormData(e.target);
  const id = uid(), menu = f.get('menu').trim(), qty = +f.get('qty'), tgl = f.get('tgl');
  db.jual.push({ id, tgl, menu, qty, harga: +f.get('harga'), bayar: f.get('bayar'), memberId: f.get('memberId') || '', hpp: hppMenu(menu) || undefined });
  applyResep(menu, qty, tgl, id);
  bulan = f.get('tgl').slice(0, 7); save(); render(); toast('Penjualan tersimpan');
}

/* ---------- STOK ---------- */
function vStok() {
  const riw = db.gerak.slice().sort((a, b) => b.tgl.localeCompare(a.tgl) || b.id.localeCompare(a.id)).slice(0, 20);
  const nm = id => (db.stok.find(s => s.id === id) || {}).nama || '(dihapus)';
  const sat = id => (db.stok.find(s => s.id === id) || {}).satuan || '';
  return `
  <div class="card"><h2>Tambah bahan baru</h2>
    <form onsubmit="addStok(event)"><div class="grid">
      <div><label>Nama bahan</label><input name="nama" placeholder="Biji kopi" required></div>
      <div><label>Satuan</label><input name="satuan" placeholder="kg / liter / pcs" required></div>
      <div><label>Batas minimum</label><input type="number" name="min" min="0" step="any" value="0"></div>
      <div><label>Harga beli / satuan (Rp)</label><input type="number" name="harga" min="0" step="any" placeholder="mis. 180000"></div>
      <div class="row-end"><button class="btn" style="width:100%">Tambah</button></div>
    </div></form>
  </div>
  <div class="card"><h2>Catat stok masuk / keluar</h2>
    ${db.stok.length ? `<form onsubmit="addGerak(event)"><div class="grid">
      <div><label>Tanggal</label><input type="date" name="tgl" value="${today()}" required></div>
      <div><label>Bahan</label><select name="itemId">${db.stok.map(s => `<option value="${s.id}">${esc(s.nama)}</option>`).join('')}</select></div>

};

/* ---------- HPP ---------- */
function hppMenu(nama) {
  const m = findMenu(nama); if (!m) return 0;
  return (m.resep || []).reduce((s, r) => s + r.qty * ((db.stok.find(x => x.id === r.itemId) || {}).harga || 0), 0);
}
const hppOf = x => x.hpp != null ? x.hpp : hppMenu(x.menu);
function hppCells(m) {
  const resep = m.resep || [];
  if (!resep.length) return '<td class="r" colspan="2"><span style="color:var(--mute)">belum ada resep</span></td>';
  const lengkap = resep.every(r => ((db.stok.find(x => x.id === r.itemId) || {}).harga || 0) > 0);
  const h = hppMenu(m.nama), laba = m.harga - h, pct = m.harga ? Math.round(laba / m.harga * 100) : 0;
  return `<td class="r">${rp(h)}${lengkap ? '' : ' <span class="tag low" title="Ada bahan tanpa harga beli">!</span>'}</td><td class="r ${laba >= 0 ? 'ok' : 'bad'}"><b>${rp(laba)}</b> <small>(${pct}%)</small></td>`;
}
function setHarga(id) {
  const s = db.stok.find(x => x.id === id); if (!s) return;
  const v = prompt(`Harga beli per ${s.satuan} untuk ${s.nama} (Rp):`, s.harga || '');
  if (v === null) return;
  const n = parseFloat(String(v).replace(/[^\d.]/g, ''));
  if (isNaN(n) || n < 0) return alert('Angka tidak valid');
  s.harga = n; save(); render(); toast('Harga beli diperbarui');
}

/* ---------- TUTUP KASIR ---------- */
let tutupTgl = today();
function sumHari(tgl) {
  const j = db.jual.filter(x => x.tgl === tgl), on = db.online.filter(o => o.tgl === tgl && o.status === 'Selesai');
  const by = m => j.filter(x => x.bayar === m).reduce((s, x) => s + x.qty * x.harga, 0);
  const tunai = by('Tunai'), qris = by('QRIS'), transfer = by('Transfer');
  const jTotal = j.reduce((s, x) => s + x.qty * x.harga, 0);
  const online = on.reduce((s, o) => s + o.qty * o.harga, 0) + (jTotal - tunai - qris - transfer);
  return { tunai, qris, transfer, online, trx: j.length + on.length, keluar: db.keluar.filter(x => x.tgl === tgl).reduce((s, x) => s + x.jumlah, 0) };
}
const kasSeharusnya = r => r.modal + r.tunai - r.keluarTunai;
const selisihTxt = d => (d > 0 ? '+' : '') + rp(d);
const selisihCls = d => d === 0 ? 'ok' : d < 0 ? 'bad' : 'warn';
function vTutup() {
  const t = sumHari(tutupTgl), ex = db.tutup.find(x => x.tgl === tutupTgl);
  const modal = ex ? ex.modal : 0, kt = ex ? ex.keluarTunai : t.keluar;
  const exp = modal + t.tunai - kt, total = t.tunai + t.qris + t.transfer + t.online;
  const sel = ex ? ex.fisik - exp : null;
  const list = db.tutup.filter(inMonth).sort((a, b) => b.tgl.localeCompare(a.tgl));
  return `
  <div class="card"><h2>Tutup kasir</h2>
    <div class="grid" style="margin-bottom:14px"><div><label>Tanggal</label><input type="date" value="${tutupTgl}" onchange="tutupTgl=this.value||tutupTgl;render()"></div></div>
    <div class="grid" style="margin-bottom:16px">
      <div class="stat"><div class="ic">💵</div><div><span>Tunai</span><b>${rp(t.tunai)}</b></div></div>
      <div class="stat"><div class="ic">📱</div><div><span>QRIS</span><b>${rp(t.qris)}</b></div></div>
      <div class="stat"><div class="ic">🏦</div><div><span>Transfer</span><b>${rp(t.transfer)}</b></div></div>
      <div class="stat"><div class="ic">🛵</div><div><span>Online / lainnya</span><b>${rp(t.online)}</b></div></div>
      <div class="stat"><div class="ic">💰</div><div><span>Total omzet</span><b>${rp(total)}</b><em>${t.trx} transaksi</em></div></div>
    </div>
    <form onsubmit="saveTutup(event)" oninput="calcTutup(this)" data-tunai="${t.tunai}">
      <div class="grid">
        <div><label>Modal awal kas (Rp)</label><input type="number" name="modal" min="0" step="500" value="${modal}"></div>
        <div><label>Pengeluaran tunai (Rp)</label><input type="number" name="keluarTunai" min="0" step="500" value="${kt}"></div>
        <div><label>Kas fisik di laci (Rp)</label><input type="number" name="fisik" min="0" step="500" value="${ex ? ex.fisik : ''}" required></div>
        <div><label>Catatan</label><input name="catatan" value="${esc(ex ? ex.catatan : '')}" placeholder="opsional"></div>
        <div class="stat"><div><span>Kas seharusnya</span><b id="tk-exp">${rp(exp)}</b></div></div>
        <div class="stat"><div><span>Selisih</span><b id="tk-sel" class="${sel === null ? '' : selisihCls(sel)}">${sel === null ? '-' : selisihTxt(sel)}</b></div></div>
      </div>
      <p style="font-size:12px;color:var(--mute);margin:10px 0 12px">Kas seharusnya = modal awal + penjualan tunai − pengeluaran tunai. Pengeluaran tunai terisi otomatis dari total pengeluaran hari itu, ubah bila ada yang dibayar non-tunai.</p>
      <button class="btn">${ex ? 'Perbarui tutup kasir' : 'Simpan tutup kasir'}</button>
    </form>
  </div>
  <div class="bar">${monthPicker()}</div>
  <div class="card wrap"><h2>Riwayat tutup kasir</h2>${list.length ? `<table><tr><th>Tgl</th><th class="r">Tunai</th><th class="r">QRIS</th><th class="r">Transfer</th><th class="r">Online</th><th class="r">Kas seharusnya</th><th class="r">Kas fisik</th><th class="r">Selisih</th><th>Catatan</th><th></th></tr>
  ${list.map(r => { const d = r.fisik - kasSeharusnya(r); return `<tr><td>${fmtDate(r.tgl)}</td><td class="r">${rp(r.tunai)}</td><td class="r">${rp(r.qris)}</td><td class="r">${rp(r.transfer)}</td><td class="r">${rp(r.online)}</td><td class="r">${rp(kasSeharusnya(r))}</td><td class="r">${rp(r.fisik)}</td><td class="r ${selisihCls(d)}"><b>${selisihTxt(d)}</b></td><td>${esc(r.catatan)}</td><td><button class="del" onclick="del('tutup','${r.id}')">Hapus</button></td></tr>`; }).join('')}</table>` : '<div class="empty">Belum ada tutup kasir bulan ini</div>'}</div>`;
}
function calcTutup(f) {
  const v = n => +f.elements[n].value || 0;
  const exp = v('modal') + (+f.dataset.tunai) - v('keluarTunai');
  $('#tk-exp').textContent = rp(exp);
  const el = $('#tk-sel');
  if (f.elements.fisik.value === '') { el.textContent = '-'; el.className = ''; return; }
  const d = v('fisik') - exp;
  el.textContent = selisihTxt(d); el.className = selisihCls(d);
}
function saveTutup(e) {
  e.preventDefault(); const f = new FormData(e.target), t = sumHari(tutupTgl);
  const modal = +f.get('modal') || 0, keluarTunai = +f.get('keluarTunai') || 0, fisik = +f.get('fisik');
  const rec = { tgl: tutupTgl, modal, tunai: t.tunai, qris: t.qris, transfer: t.transfer, online: t.online, keluarTunai, fisik, selisih: fisik - (modal + t.tunai - keluarTunai), catatan: f.get('catatan').trim() };
  const ex = db.tutup.find(x => x.tgl === tutupTgl);
  if (ex) Object.assign(ex, rec); else db.tutup.push({ id: uid(), ...rec });
  bulan = tutupTgl.slice(0, 7); save(); render(); toast('Tutup kasir tersimpan');
}

/* ---------- SUPABASE ---------- */
const COLS = ['stok', 'gerak', 'jual', 'keluar', 'menu', 'member', 'karyawan', 'absen', 'online', 'tutup'];
const SB_DEFAULT = { url: '', key: '' }; // opsional: isi di sini, atau lewat menu Pengaturan
const SBKEY = 'kopicatat_sb', DIRTY = 'kopicatat_dirty';
let sbCfg = (() => { try { return JSON.parse(localStorage.getItem(SBKEY)) || SB_DEFAULT; } catch (e) { return SB_DEFAULT; } })();
const sbOn = () => !!(sbCfg.url && sbCfg.key);
let sbState = 'off', sbErr = '', snap = {}, rev = 0, flushing = false, flushTimer = null;

const SQL_SETUP = `create table if not exists public.kopi_records (
  collection text not null,
  id text not null,
  data jsonb not null,
  updated_at timestamptz not null default now(),
  primary key (collection, id)
);

alter table public.kopi_records enable row level security;

drop policy if exists "kopi_anon_all" on public.kopi_records;
create policy "kopi_anon_all" on public.kopi_records
  for all to anon using (true) with check (true);`;

// stringify dengan urutan key tetap (jsonb di Postgres mengurutkan ulang key)
const canon = v => JSON.stringify(v, (k, val) => val && typeof val === 'object' && !Array.isArray(val)
  ? Object.keys(val).sort().reduce((o, key) => (o[key] = val[key], o), {}) : val);
const mapOf = d => { const m = {}; COLS.forEach(c => (d[c] || []).forEach(x => m[c + '/' + x.id] = canon(x))); return m; };
const splitKey = k => { const i = k.indexOf('/'); return [k.slice(0, i), k.slice(i + 1)]; };
const sameMap = (a, b) => { const ka = Object.keys(a); return ka.length === Object.keys(b).length && ka.every(k => a[k] === b[k]); };
function goTab(t) { const b = document.querySelector(`#nav button[data-t="${t}"]`); if (b) b.click(); }

function setSb(st, msg) {
  sbState = st; sbErr = msg || '';
  const c = $('#sbchip');
  if (c) { c.textContent = { off: '💾 Lokal', ok: '☁️ Tersinkron', sync: '⏳ Sinkron…', err: '⚠️ Offline' }[st]; c.className = 'chip ' + st; }
  const ae = document.activeElement;
  if (tab === 'setting' && !(ae && ae.matches && ae.matches('input'))) render();
}

async function sbReq(method, path, body, extra) {
  const r = await fetch(sbCfg.url.replace(/\/+$/, '') + '/rest/v1/' + path, {
    method,
    headers: Object.assign({ apikey: sbCfg.key, Authorization: 'Bearer ' + sbCfg.key, 'Content-Type': 'application/json' }, extra || {}),
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) {
    let t = ''; try { t = (await r.json()).message || ''; } catch (e) { }
    throw new Error(t || ('HTTP ' + r.status));
  }
  return method === 'GET' ? r.json() : null;
}

async function sbPull() {
  const rows = []; let off = 0;
  for (; ;) {
    const part = await sbReq('GET', `kopi_records?select=collection,id,data&order=collection,id&limit=1000&offset=${off}`);
    rows.push(...part);
    if (part.length < 1000) break;
    off += 1000;
  }
  const r = empty();
  rows.forEach(x => { if (r[x.collection]) r[x.collection].push(x.data); });
  return r;
}

function queueSync() {
  if (!sbOn()) return;
  rev++; localStorage.setItem(DIRTY, '1');
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500);
}

async function flush() {
  if (!sbOn()) return;
  if (flushing) { flushTimer = setTimeout(flush, 400); return; }
  flushing = true; const r0 = rev; setSb('sync');
  try {
    const cur = mapOf(db), ups = {}, dels = {};
    for (const k in cur) if (snap[k] !== cur[k]) { const [c, id] = splitKey(k); (ups[c] ||= []).push({ collection: c, id, data: JSON.parse(cur[k]), updated_at: new Date().toISOString() }); }
    for (const k in snap) if (!(k in cur)) { const [c, id] = splitKey(k); (dels[c] ||= []).push(id); }
    for (const c in ups) for (let i = 0; i < ups[c].length; i += 500)
      await sbReq('POST', 'kopi_records?on_conflict=collection,id', ups[c].slice(i, i + 500), { Prefer: 'resolution=merge-duplicates,return=minimal' });
    for (const c in dels) for (let i = 0; i < dels[c].length; i += 50)
      await sbReq('DELETE', `kopi_records?collection=eq.${c}&id=in.(${dels[c].slice(i, i + 50).join(',')})`);
    snap = cur;
    if (rev === r0) localStorage.removeItem(DIRTY);
    setSb('ok');
  } catch (e) {
    localStorage.setItem(DIRTY, '1'); setSb('err', e.message || String(e));
  } finally { flushing = false; }
}

// Tarik data dari Supabase. merge: gabungkan data lokal yang belum tersinkron (sambungan pertama / habis offline)
async function sbSync(opts = {}) {
  if (!sbOn()) return setSb('off');
  setSb('sync');
  try {
    const remote = await sbPull(), rmap = mapOf(remote);
    const dirty = opts.merge || localStorage.getItem(DIRTY);
    let next = remote;
    if (dirty) {
      next = empty();
      COLS.forEach(c => {
        const local = db[c] || [], lids = new Set(local.map(x => x.id));
        next[c] = remote[c].filter(x => !lids.has(x.id)).concat(local);
      });
    }
    db = next; snap = rmap;
    localStorage.setItem(KEY, JSON.stringify(db));
    render();
    if (dirty) { localStorage.setItem(DIRTY, '1'); await flush(); } else setSb('ok');
  } catch (e) { setSb('err', e.message || String(e)); }
}

// Segarkan diam-diam saat tab dibuka lagi (mis. data diubah dari HP/perangkat lain)
async function sbRefresh() {
  if (!sbOn() || flushing || localStorage.getItem(DIRTY)) return;
  try {
    const remote = await sbPull(), rmap = mapOf(remote);
    if (flushing || localStorage.getItem(DIRTY) || sameMap(rmap, mapOf(db))) return;
    const ae = document.activeElement;
    if (ae && ae.matches && ae.matches('input,select')) return;
    db = remote; snap = rmap; localStorage.setItem(KEY, JSON.stringify(db)); render();
  } catch (e) { }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) sbRefresh(); });
window.addEventListener('online', () => { if (sbOn() && localStorage.getItem(DIRTY)) sbSync(); });

function vSetting() {
  const st = { off: 'Belum tersambung. Data hanya tersimpan di browser ini.', ok: 'Tersambung dan tersinkron.', sync: 'Menyinkronkan…', err: 'Gagal: ' + sbErr }[sbState];
  return `
  <div class="card"><h2>Koneksi Supabase</h2>
    <p style="margin:0 0 12px;font-size:14px" class="${sbState === 'ok' ? 'ok' : sbState === 'err' ? 'bad' : ''}"><b>${esc(st)}</b></p>
    <form onsubmit="saveSb(event)"><div class="grid two" style="gap:10px">
      <div><label>Project URL</label><input name="url" placeholder="https://xxxx.supabase.co" value="${esc(sbCfg.url)}" required></div>
      <div><label>Anon (public) key</label><input name="key" type="password" placeholder="eyJ..." value="${esc(sbCfg.key)}" required></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn">Simpan &amp; sambungkan</button>
      ${sbOn() ? `<button type="button" class="btn alt" onclick="sbSync()">Sinkron sekarang</button><button type="button" class="btn alt" style="color:var(--bad);border-color:var(--bad)" onclick="disconnectSb()">Putuskan</button>` : ''}
    </div></form>
    <p style="font-size:12px;color:var(--mute);margin:12px 0 0">Pertama kali tersambung, data lokal digabung ke database. Setelah itu setiap perubahan otomatis dikirim; jika offline, dikirim saat koneksi kembali.</p>
  </div>
  <div class="card"><h2>Setup database (sekali saja)</h2>
    <ol class="steps"><li>Buat project di supabase.com.</li><li>Buka <b>SQL Editor</b>, tempel SQL di bawah, lalu <b>Run</b>.</li><li>Ambil <b>Project URL</b> dan <b>anon key</b> di Project Settings → API, isi di atas.</li></ol>
    <div class="code">${esc(SQL_SETUP)}</div>
    <button class="btn alt" onclick="navigator.clipboard.writeText(SQL_SETUP).then(() => toast('SQL disalin'))">Salin SQL</button>
    <p style="font-size:13px;margin:14px 0 0;color:var(--warn)"><b>Perhatian:</b> aplikasi ini belum memakai login, jadi siapa pun yang memegang URL dan anon key bisa membaca dan mengubah data. Cukup untuk uji coba; tambahkan login sebelum dipakai sungguhan.</p>
  </div>`;
}
async function saveSb(e) {
  e.preventDefault(); const f = new FormData(e.target);
  const url = f.get('url').trim().replace(/\/+$/, ''), key = f.get('key').trim();
  if (!/^https:\/\/.+/.test(url)) return alert('URL harus diawali https://');
  sbCfg = { url, key }; localStorage.setItem(SBKEY, JSON.stringify(sbCfg));
  await sbSync({ merge: true });
  toast(sbState === 'ok' ? 'Tersambung ke Supabase' : 'Gagal tersambung');
}
function disconnectSb() {
  if (!confirm('Putuskan Supabase? Data di browser ini tetap ada, hanya berhenti sinkron.')) return;
  sbCfg = { url: '', key: '' }; localStorage.removeItem(SBKEY); localStorage.removeItem(DIRTY); snap = {};
  setSb('off'); render();
}

/* ---------- UTIL ---------- */
function del(tbl, id) {
  const msg = tbl === 'stok' ? 'Hapus bahan beserta riwayat geraknya?' : 'Hapus data ini?';
  if (!confirm(msg)) return;
  db[tbl] = db[tbl].filter(x => x.id !== id);
  if (tbl === 'stok') {
    db.gerak = db.gerak.filter(g => g.itemId !== id);
    db.menu.forEach(m => m.resep = (m.resep || []).filter(r => r.itemId !== id));
  }
  if (tbl === 'jual' || tbl === 'online') db.gerak = db.gerak.filter(g => g.ref !== id);
  if (tbl === 'karyawan') db.absen = db.absen.filter(a => a.karyawanId !== id);
  save(); render();
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Jenis', 'Tanggal', 'Menu/Kategori', 'Keterangan', 'Qty', 'Harga', 'Total', 'Bayar']];
  db.jual.filter(inMonth).forEach(x => rows.push(['Penjualan', x.tgl, x.menu, '', x.qty, x.harga, x.qty * x.harga, x.bayar]));
  db.keluar.filter(inMonth).forEach(x => rows.push(['Pengeluaran', x.tgl, x.kategori, x.ket, '', '', x.jumlah, '']));
  db.online.filter(o => inMonth(o) && o.status === 'Selesai').forEach(x => rows.push(['Online ' + x.platform, x.tgl, x.menu, x.noOrder, x.qty, x.harga, x.qty * x.harga, 'Online']));
  rows.sort((a, b) => (a[0] === 'Jenis' ? -1 : b[0] === 'Jenis' ? 1 : a[1].localeCompare(b[1])));
  download(`laporan-${bulan}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}
function backup() { download(`kopicatat-backup-${today()}.json`, JSON.stringify(db, null, 2), 'application/json'); }
function restore(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!confirm('Data saat ini akan diganti. Lanjut?')) return;
      db = Object.assign(empty(), d); save(); render(); toast('Data dipulihkan');
    } catch (e) { alert('File backup tidak valid'); }
  };
  r.readAsText(f);
}
render();
setSb(sbOn() ? 'sync' : 'off');
if (sbOn()) sbSync();
</script>
</body>
