<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kopi Catat</title>
<meta name="theme-color" content="#2b1b17">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d9572b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 2v2M14 2v2M6 2v2'/%3E%3Cpath d='M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f2;--card:#fff;--ink:#1f1814;--mute:#756a62;--line:#ece3da;--brand:#b8431d;--brand-d:#9a3716;--accent:#d9572b;--soft:#f8ebe4;--ok:#1f7a4a;--ok-bg:#e5f3ea;--bad:#c42b3c;--bad-bg:#fbe8ea;--warn:#a96a0f;--warn-bg:#fdf1db;--side:#2b1b17;--r:12px;--shadow:0 1px 2px rgba(43,27,23,.04),0 2px 8px rgba(43,27,23,.04)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
svg.i{flex:none;display:block}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;min-height:100vh}

/* sidebar */
.side{width:240px;background:var(--side);color:#e8dfd6;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:#a8998b;margin-top:1px}
#nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:none}
#nav button{position:relative;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#c9bcaf;padding:0 12px;height:40px;border-radius:9px;font-size:13.5px;font-weight:550;cursor:pointer;text-align:left;transition:background .15s,color .15s}
#nav button:hover{background:rgba(255,255,255,.06);color:#fff}
#nav button.on{background:rgba(255,255,255,.1);color:#fff}
#nav button.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
#nav button.on svg{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.4;color:#9a8b7d;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot svg{margin-top:1px}

/* topbar + konten */
.content{flex:1;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px;padding:0 24px;background:rgba(250,246,242,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.015em}
.tr{display:flex;align-items:center;gap:12px}
#hdate{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
main{padding:20px 24px 32px}

/* kartu */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:var(--shadow);min-width:0}
.card h2{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:650;margin:0 0 12px}
.card h2 svg{color:var(--mute)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.split>.card{margin-bottom:0}
.split.top{align-items:start}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:16px}
.dash>.card{margin-bottom:0;display:flex;flex-direction:column}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s3{grid-column:span 3}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.stats>.stat{flex:1 1 215px}
.stats.sm>.stat{flex-basis:165px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* form: field melebar mengisi baris, tombol di ujung, tanpa sel kosong */
form>.grid{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
form>.grid>div{flex:1 1 150px;min-width:0}
form>.grid>.row-end{flex:0 0 auto}
.row-end{display:flex;align-items:flex-end}
label{display:block;font-size:12px;font-weight:550;color:var(--mute);margin-bottom:4px}
input,select{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:hover,select:hover{border-color:#dccfc4}
input:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,87,43,.22)}
input[type=file]{height:auto}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;background:var(--brand);color:#fff;border:1px solid var(--brand);border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--brand-d)}
.btn.alt{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.alt:hover{background:var(--soft);border-color:#dccfc4}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
label.btn{display:inline-flex;margin:0;font-size:14px;color:var(--ink)}
.ib{width:30px;height:30px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:8px;color:var(--mute);cursor:pointer;transition:background .15s,color .15s}
.ib:hover{background:var(--soft);color:var(--brand)}
.ib.dng:hover{background:var(--bad-bg);color:var(--bad)}

/* tabel */
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;background:#fbf7f3;white-space:nowrap}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fdf9f6}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.act{width:1%;white-space:nowrap;text-align:right}
td select{width:auto;height:30px;padding:0 8px;font-size:13px}

/* statistik */
.stat{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.stat .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--brand);flex-shrink:0}
.stat .ic.ok{background:var(--ok-bg);color:var(--ok)}
.stat .ic.bad{background:var(--bad-bg);color:var(--bad)}
.stat span{font-size:12px;color:var(--mute);font-weight:550}
.stat b{display:block;white-space:nowrap;font-size:18px;margin-top:1px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--mute)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}

/* label status */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.tag.low{background:var(--bad-bg);color:var(--bad)}.tag.good{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.mute{background:var(--soft);color:var(--brand)}
.tag a{display:inline-grid;place-items:center;color:inherit;opacity:.7}.tag a:hover{opacity:1}
.muted{color:var(--mute);font-size:13px}
.empty{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mute);text-align:center;padding:20px 16px;font-size:14px;min-height:76px}
.empty.ok{color:var(--ok)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:14px 0 0;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
.note svg{margin-top:2px}
/* dropdown kustom */
::placeholder{color:#b5a89e;opacity:1}
input[type=date],input[type=month],input[type=time]{accent-color:var(--accent)}
input::-webkit-calendar-picker-indicator{opacity:.5;cursor:pointer;transition:opacity .15s}
input::-webkit-calendar-picker-indicator:hover{opacity:1}
.dd{position:relative;display:block;width:100%}
.dd>select{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:none}
.dd-btn{width:100%;height:38px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 9px 0 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:14px;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s}
.dd-btn:hover{border-color:#dccfc4}
.dd-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn svg{color:var(--mute);transition:transform .15s}
.dd.open .dd-btn{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,87,43,.22)}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd.sm{display:inline-block;width:auto;min-width:112px;vertical-align:middle}
.dd.sm .dd-btn{height:30px;font-size:13px;font-weight:600;padding:0 8px 0 10px}
.dd.sm[data-v=Selesai] .dd-btn{background:var(--ok-bg);border-color:#cfe8d9;color:var(--ok)}
.dd.sm[data-v=Batal] .dd-btn{background:var(--bad-bg);border-color:#f3cdd1;color:var(--bad)}
.dd.sm[data-v=Diterima] .dd-btn{background:var(--warn-bg);border-color:#f1dfb8;color:var(--warn)}
.pop{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(43,27,23,.16),0 2px 6px rgba(43,27,23,.06);padding:4px;max-height:260px;overflow:auto}
.pop [role=option]{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:7px;font-size:14px;cursor:pointer;white-space:nowrap}
.pop [role=option].act{background:var(--soft)}
.pop [role=option][aria-selected=true]{color:var(--brand);font-weight:600}
.pop .none{padding:8px 10px;color:var(--mute);font-size:13px}
/* tooltip + hint */
.tip{position:fixed;z-index:60;background:#2b1b17;color:#fff;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:7px;max-width:260px;pointer-events:none;opacity:0;transition:opacity .12s;box-shadow:0 4px 14px rgba(43,27,23,.25)}
.tip.show{opacity:1}
.hint{display:flex;gap:7px;align-items:flex-start;margin:10px 0 0;padding:8px 10px;border-radius:8px;background:var(--soft);font-size:12.5px;line-height:1.45;color:#6b4a3b}
.hint svg{margin-top:2px;color:var(--accent)}

.gate{max-width:520px;margin:40px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 24px}
.gate h2{margin:6px 0 0;font-size:17px}
.gate p{margin:0 0 10px;color:var(--mute);font-size:14px;line-height:1.55}
.gate>svg{color:var(--accent)}
.scroll{flex:1;max-height:300px;overflow:auto}

/* toolbar */
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.bar>div{flex:0 0 auto}
.bar>div:first-child input{width:170px}
.bar b{display:inline-flex;align-items:center;height:38px;padding:0 14px;background:#fff;border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
.bar .grp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* grafik */
.chart{display:flex;align-items:flex-end;gap:3px;flex:1;min-height:200px;padding-top:8px;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%;min-width:0}
.chart .col i{flex:1;border-radius:3px 3px 0 0}
.chart .a{background:var(--brand)}.chart .b{background:#efc3b0}
.axis{display:flex;gap:3px;font-size:10px;color:var(--mute);margin-top:4px}
.axis span{flex:1;text-align:center;overflow:hidden;min-height:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.hb{margin:10px 0}
.hb .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.hb .t span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.hb .fill{height:100%;background:var(--accent);border-radius:99px}

/* status sinkron */
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-bg);border-color:#cfe8d9}
.chip.err{color:var(--bad);background:var(--bad-bg);border-color:#f3cdc8}
.chip.sync{color:var(--warn);background:var(--warn-bg);border-color:#f1dfb8}
.chip.sync svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.code{background:#2b1b17;color:#f1e6da;border-radius:10px;padding:12px;font-size:12px;overflow:auto;white-space:pre;margin:8px 0 12px}
ol.steps{padding-left:20px;margin:0;font-size:14px;line-height:1.7}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b211b;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30}
.toast.show{opacity:1}

@media(max-width:1180px){.s8,.s4{grid-column:span 12}.s3{grid-column:span 6}}
@media(max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
@media(max-width:820px){
  .app{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20;border-top:1px solid rgba(255,255,255,.08)}
  .brand,.side-foot{display:none}
  #nav{flex-direction:row;overflow-x:auto;width:100%;gap:2px}
  #nav button{flex-direction:column;gap:3px;padding:6px 8px;height:auto;min-width:68px;font-size:10.5px;justify-content:center;align-items:center;text-align:center}
  #nav button.on::before{left:25%;right:25%;top:-6px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .topbar{padding:0 14px;height:54px}
  .topbar h1{font-size:17px}
  #hdate{display:none}
  main{padding:14px 14px 92px}
  .toast{bottom:84px}
  .bar .grp{margin-left:0}
}
@media(max-width:560px){
  .s3{grid-column:span 12}.card{padding:14px}
  .stats{gap:10px}.stats>.stat{flex:1 1 calc(50% - 5px);flex-direction:column;align-items:flex-start;gap:8px;padding:12px}
  .stat b{font-size:17px}
  .bar>div:first-child{flex:1 1 100%}.bar>div:first-child input{width:100%}
  .bar .grp{flex:1 1 100%}.bar .grp .btn{flex:1;padding:0 8px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"></div><div><b>Kopi Catat</b><small>Pencatatan coffee shop</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"></div>
  </aside>
  <div class="content">
    <header class="topbar"><h1 id="ptitle">Dashboard</h1><div class="tr"><button type="button" class="chip" id="sbchip" onclick="goTab('setting')" title="Status sinkron"></button><span id="hdate"></span></div></header>
    <main id="app"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'kopicatat_v1';
const empty = () => ({ stok: [], gerak: [], jual: [], keluar: [], menu: [], member: [], karyawan: [], absen: [], online: [], tutup: [] });
let db;
try { db = Object.assign(empty(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { db = empty(); }
const save = () => { localStorage.setItem(KEY, JSON.stringify(db)); queueSync(); };

const $ = s => document.querySelector(s);
const P = {
  coffee:'<path d="M10 2v2"/><path d="M14 2v2"/><path d="M6 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/>',
  dash:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
  bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  box:'<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  lock:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  up:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',

/* ---------- DROPDOWN, SARAN KETIKAN, TOOLTIP ---------- */
let pop = null;
function closePop() { if (!pop) return; pop.el.remove(); if (pop.owner) pop.owner.classList.remove('open'); pop = null; }
function drawPop() {
  const { el, items, idx } = pop;
  el.innerHTML = items.length ? items.map((it, i) => `<div role="option" data-i="${i}" class="${i === idx ? 'act' : ''}" aria-selected="${!!it.sel}"><span>${esc(it.label)}</span>${it.sel ? ic('check', 14) : ''}</div>`).join('') : '<div class="none">Tidak ada pilihan</div>';
  const a = el.querySelector('.act'); if (a && el.isConnected) a.scrollIntoView({ block: 'nearest' });
}
function placePop() {
  const { el, anchor } = pop, r = anchor.getBoundingClientRect();
  el.style.minWidth = r.width + 'px';
  const h = el.offsetHeight, below = innerHeight - r.bottom, up = below < h + 12 && r.top > below;
  el.style.left = Math.max(8, Math.min(r.left, innerWidth - el.offsetWidth - 8)) + 'px';
  el.style.top = (up ? r.top - h - 6 : r.bottom + 6) + 'px';
}
function showPop(anchor, items, pick, owner, filter) {
  closePop();
  const el = document.createElement('div'); el.className = 'pop'; el.setAttribute('role', 'listbox');
  pop = { el, anchor, items, pick, owner, filter, idx: filter ? -1 : Math.max(0, items.findIndex(i => i.sel)) };
  if (owner) owner.classList.add('open');
  document.body.appendChild(el); drawPop(); placePop();
  el.addEventListener('mouseover', e => {
    const o = e.target.closest('[role=option]'); if (!o) return;
    pop.idx = +o.dataset.i; el.querySelectorAll('.act').forEach(x => x.classList.remove('act')); o.classList.add('act');
  });
}
document.addEventListener('mousedown', e => {
  if (!pop) return;
  const opt = e.target.closest && e.target.closest('.pop [role=option]');
  if (opt && pop.el.contains(opt)) { e.preventDefault(); const it = pop.items[+opt.dataset.i]; pop.pick(it); closePop(); return; }
  if (pop.el.contains(e.target) || pop.anchor.contains(e.target) || (pop.owner && pop.owner.contains(e.target))) return;
  closePop();
});
document.addEventListener('keydown', e => {
  if (!pop) return;
  const n = pop.items.length;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!n) return; e.preventDefault();
    const d = e.key === 'ArrowDown' ? 1 : -1;
    pop.idx = pop.idx < 0 ? (d > 0 ? 0 : n - 1) : (pop.idx + d + n) % n; drawPop();
  } else if (e.key === 'Enter') {
    if (n && pop.idx >= 0) { e.preventDefault(); const it = pop.items[pop.idx]; pop.pick(it); closePop(); }
  } else if (e.key === 'Escape' || e.key === 'Tab') closePop();
}, true);
addEventListener('scroll', e => { if (pop && !pop.el.contains(e.target)) closePop(); hideTip(); }, true);
addEventListener('resize', closePop);

function enhanceSelects(root) {
  root.querySelectorAll('select:not([data-dd])').forEach(sel => {
    sel.dataset.dd = 1; sel.tabIndex = -1;
    const w = document.createElement('div'); w.className = 'dd' + (sel.closest('td') ? ' sm' : '');
    const b = document.createElement('button'); b.type = 'button'; b.className = 'dd-btn'; b.setAttribute('aria-haspopup', 'listbox');
    sel.parentNode.insertBefore(w, sel); w.append(b, sel);
    const sync = () => { const o = sel.options[sel.selectedIndex]; b.innerHTML = `<span>${esc(o ? o.text : '')}</span>${ic('chev', 16)}`; w.dataset.v = sel.value; };
    sync(); sel.addEventListener('change', sync);
    b.addEventListener('click', () => {
      if (pop && pop.owner === w) return closePop();
      showPop(b, [...sel.options].map((o, i) => ({ label: o.text, value: i, sel: i === sel.selectedIndex })), it => {
        sel.selectedIndex = it.value; sel.dispatchEvent(new Event('change', { bubbles: true }));
      }, w);
    });
  });
}
function enhanceSuggest(root) {
  root.querySelectorAll('input[list]').forEach(inp => {
    const dl = document.getElementById(inp.getAttribute('list')); if (!dl) return;
    inp.removeAttribute('list'); inp.autocomplete = 'off';
    const open = () => {
      const q = inp.value.trim().toLowerCase();
      const items = [...dl.options].map(o => o.value).filter(v => !q || v.toLowerCase().includes(q)).slice(0, 30).map(v => ({ label: v, value: v, sel: v.toLowerCase() === q }));
      if (!items.length) return closePop();
      showPop(inp, items, it => { inp.value = it.value; inp.dispatchEvent(new Event('input', { bubbles: true })); }, null, true);
    };
    inp.addEventListener('focus', open); inp.addEventListener('input', open);
    inp.addEventListener('click', () => { if (!pop) open(); });
  });
}
const tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl);
function hideTip() { tipEl.classList.remove('show'); }
function showTip(t) {
  tipEl.textContent = t.dataset.tip; const r = t.getBoundingClientRect();
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + 'px';
  tipEl.style.top = (r.top - h - 8 < 8 ? r.bottom + 8 : r.top - h - 8) + 'px';
  tipEl.classList.add('show');
}
function enhanceTips() {
  document.querySelectorAll('[title]').forEach(el => {
    el.dataset.tip = el.getAttribute('title');
    if (!el.getAttribute('aria-label') && /^(BUTTON|A)$/.test(el.tagName)) el.setAttribute('aria-label', el.dataset.tip);
    el.removeAttribute('title');
  });
}
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); t ? showTip(t) : hideTip(); });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); t ? showTip(t) : hideTip(); });
document.addEventListener('focusout', hideTip);
function enhanceUI() { closePop(); hideTip(); const r = $('#app'); enhanceSelects(r); enhanceSuggest(r); enhanceTips(); }

/* ---------- DASHBOARD ---------- */
function hbars(entries, fmt) {
  const max = Math.max(...entries.map(e => e[1]), 1);
  return entries.map(([n, v]) => `<div class="hb"><div class="t"><span title="${esc(n)}">${esc(n)}</span><b>${fmt(v)}</b></div><div class="track"><div class="fill" style="width:${Math.max(3, v / max * 100)}%"></div></div></div>`).join('');
}
function vLaporan() {
  const j = db.jual.filter(inMonth), k = db.keluar.filter(inMonth);
  const on = db.online.filter(o => inMonth(o) && o.status === 'Selesai');
  const omzetOn = on.reduce((s, o) => s + o.qty * o.harga, 0);
  const fee = on.reduce((s, o) => s + o.qty * o.harga * (o.fee || 0) / 100, 0);
  const omzet = j.reduce((s, x) => s + x.qty * x.harga, 0) + omzetOn;
  const out = k.reduce((s, x) => s + x.jumlah, 0) + fee;
  const laba = omzet - out;
  const margin = omzet ? Math.round(laba / omzet * 100) + '% margin' : 'belum ada omzet';
  const byMenu = {};
  [...j, ...on].forEach(x => { const m = byMenu[x.menu.toLowerCase()] ||= { nama: x.menu, qty: 0, total: 0 }; m.qty += x.qty; m.total += x.qty * x.harga; });
  const top = Object.values(byMenu).sort((a, b) => b.qty - a.qty).slice(0, 5);
  const byCat = {}; k.forEach(x => byCat[x.kategori] = (byCat[x.kategori] || 0) + x.jumlah);
  if (fee) byCat['Potongan Platform'] = fee;
  const byPay = {}; j.forEach(x => byPay[x.bayar] = (byPay[x.bayar] || 0) + x.qty * x.harga);
  if (omzetOn) byPay['Online'] = (byPay['Online'] || 0) + omzetOn;
  const low = db.stok.filter(s => stokNow(s.id) <= s.min);
  const byLaba = {};
  [...j, ...on].forEach(x => { const m = byLaba[x.menu.toLowerCase()] ||= { nama: x.menu, total: 0, hpp: 0 }; m.total += x.qty * x.harga; m.hpp += hppOf(x) * x.qty; });
  const allLaba = Object.values(byLaba).map(m => ({ ...m, laba: m.total - m.hpp }));
  const labaMenu = allLaba.slice().sort((a, b) => b.laba - a.laba).slice(0, 5);
  const hppTotal = allLaba.reduce((s, m) => s + m.hpp, 0), labaTotalMenu = allLaba.reduce((s, m) => s + m.laba, 0);
  const tanpaHpp = allLaba.some(m => m.hpp === 0);
  const hariIni = db.jual.filter(x => x.tgl === today()).reduce((s, x) => s + x.qty * x.harga, 0)
    + db.online.filter(o => o.tgl === today() && o.status === 'Selesai').reduce((s, o) => s + o.qty * o.harga, 0);

  // grafik harian
  const [Y, M] = bulan.split('-').map(Number), days = new Date(Y, M, 0).getDate();
  const dIn = new Array(days).fill(0), dOut = new Array(days).fill(0), di = t => +t.slice(8, 10) - 1;
  j.forEach(x => dIn[di(x.tgl)] += x.qty * x.harga);
  on.forEach(o => { dIn[di(o.tgl)] += o.qty * o.harga; dOut[di(o.tgl)] += o.qty * o.harga * (o.fee || 0) / 100; });
  k.forEach(x => dOut[di(x.tgl)] += x.jumlah);
  const mx = Math.max(...dIn, ...dOut, 1);
  const chart = dIn.map((v, i) => `<div class="col" title="Tgl ${i + 1}: omzet ${rp(v)}, keluar ${rp(dOut[i])}"><i class="a" style="height:${v / mx * 100}%"></i><i class="b" style="height:${dOut[i] / mx * 100}%"></i></div>`).join('');
  const axis = dIn.map((_, i) => `<span>${i === 0 || (i + 1) % 5 === 0 ? i + 1 : ''}</span>`).join('');

  const stat = (icon, cls, label, val, sub, vcls) => `<div class="stat"><div class="ic ${cls}">${ic(icon, 20)}</div><div><span>${label}</span><b class="${vcls}">${val}</b><em>${sub}</em></div></div>`;
  const empty = t => `<div class="empty">${t}</div>`;
  return `
  <div class="bar">${monthPicker()}
    <div class="grp"><button class="btn alt" onclick="exportCSV()">${ic('download', 16)}Ekspor CSV</button><button class="btn alt" onclick="backup()">${ic('db', 16)}Backup</button><label class="btn alt" for="rs">${ic('upload', 16)}Restore</label><input id="rs" type="file" accept=".json" hidden onchange="restore(this)"></div>
  </div>
  <div class="stats">
    ${stat('cash', '', 'Omzet', rp(omzet), `${j.length + on.length} transaksi`, '')}
    ${stat('wallet', '', 'Pengeluaran', rp(out), 'termasuk potongan platform', '')}
    ${stat(laba >= 0 ? 'up' : 'down', laba >= 0 ? 'ok' : 'bad', 'Laba kasar', rp(laba), margin, laba >= 0 ? 'ok' : 'bad')}
    ${stat('sun', '', 'Omzet hari ini', rp(hariIni), fmtDate(today()), '')}
    ${stat('calc', '', 'Laba menu (omzet − HPP)', rp(labaTotalMenu), `HPP ${rp(hppTotal)}`, labaTotalMenu >= 0 ? 'ok' : 'bad')}
  </div>
  <div class="dash">
    <div class="card s8"><h2>Omzet vs pengeluaran harian</h2>
      <div class="legend"><span><i style="background:var(--brand)"></i>Omzet</span><span><i style="background:#efc3b0"></i>Pengeluaran</span></div>
      ${omzet || out ? `<div class="chart">${chart}</div><div class="axis">${axis}</div>` : empty('Belum ada data bulan ini')}
    </div>
    <div class="card s4"><h2>${ic(low.length ? 'alert' : 'box', 16)}${low.length ? `Stok menipis (${low.length})` : 'Status stok'}</h2>${db.stok.length ? `<div class="scroll"><table>${db.stok.slice().sort((a, b) => (stokNow(a.id) <= a.min ? 0 : 1) - (stokNow(b.id) <= b.min ? 0 : 1)).map(s => { const lo = stokNow(s.id) <= s.min; return `<tr><td>${esc(s.nama)}</td><td class="r ${lo ? 'bad' : ''}">${num(stokNow(s.id))} ${esc(s.satuan)}</td><td class="act"><span class="tag ${lo ? 'low' : 'good'}">${lo ? 'Menipis' : 'Aman'}</span></td></tr>`; }).join('')}</table></div>` : '<div class="empty">Belum ada bahan</div>'}</div>
    <div class="card s3"><h2>Menu terlaris</h2>${top.length ? hbars(top.map(m => [`${m.nama} · ${num(m.qty)}x`, m.total]), rp) : empty('Belum ada penjualan')}</div>
    <div class="card s3"><h2>Laba per menu (estimasi)</h2>${labaMenu.length ? hbars(labaMenu.map(m => [`${m.nama} · margin ${m.total ? Math.round(m.laba / m.total * 100) : 0}%`, m.laba]), rp) + (tanpaHpp ? `<p class="hint">${ic('info', 14)}<span>Menu tanpa resep atau harga bahan dihitung HPP Rp 0.</span></p>` : '') : empty('Belum ada penjualan')}</div>
    <div class="card s3"><h2>Metode pembayaran</h2>${Object.keys(byPay).length ? hbars(Object.entries(byPay), rp) : empty('Kosong')}</div>
    <div class="card s3"><h2>Pengeluaran per kategori</h2>${Object.keys(byCat).length ? hbars(Object.entries(byCat), rp) : empty('Kosong')}</div>
  </div>`;
}

    db.gerak.push({ id: uid(), tgl, itemId: r.itemId, tipe: 'keluar', qty: r.qty * qty, cat: 'Resep: ' + m.nama, ref });

  const m = db.member.find(x => x.id === id); if (!m) return;

  if (!a || !p) return 0;
  const [h1, m1] = a.split(':').map(Number), [h2, m2] = p.split(':').map(Number);
  let d = (h2 * 60 + m2) - (h1 * 60 + m1); if (d < 0) d += 1440; return d / 60;
};

let tutupTgl = today();
function sumHari(tgl) {
  const j = db.jual.filter(x => x.tgl === tgl), on = db.online.filter(o => o.tgl === tgl && o.status === 'Selesai');
  const by = m => j.filter(x => x.bayar === m).reduce((s, x) => s + x.qty * x.harga, 0);
  const tunai = by('Tunai'), qris = by('QRIS'), transfer = by('Transfer');
  const jTotal = j.reduce((s, x) => s + x.qty * x.harga, 0);
  const online = on.reduce((s, o) => s + o.qty * o.harga, 0) + (jTotal - tunai - qris - transfer);
  return { tunai, qris, transfer, online, trx: j.length + on.length, keluar: db.keluar.filter(x => x.tgl === tgl).reduce((s, x) => s + x.jumlah, 0) };
}

        <div><label>Pengeluaran tunai (Rp)</label><input type="number" name="keluarTunai" min="0" step="500" value="${kt}"></div>

      </div>

  ${list.map(r => { const d = r.fisik - kasSeharusnya(r); return `<tr><td>${fmtDate(r.tgl)}</td><td class="r">${rp(r.tunai)}</td><td class="r">${rp(r.qris)}</td><td class="r">${rp(r.transfer)}</td><td class="r">${rp(r.online)}</td><td class="r">${rp(kasSeharusnya(r))}</td><td class="r">${rp(r.fisik)}</td><td class="r ${selisihCls(d)}"><b>${selisihTxt(d)}</b></td><td>${esc(r.catatan)}</td><td class="act"><button class="ib dng" title="Hapus" aria-label="Hapus" onclick="del('tutup','${r.id}')">${ic('trash', 16)}</button></td></tr>`; }).join('')}</table>` : '<div class="empty">Belum ada tutup kasir bulan ini</div>'}</div>`;

function saveTutup(e) {

/* ---------- CLOUD ---------- */
const COLS = ['stok', 'gerak', 'jual', 'keluar', 'menu', 'member', 'karyawan', 'absen', 'online', 'tutup'];
const SB_DEFAULT = { url: '', key: '' }; // opsional: isi di sini, atau lewat menu Pengaturan
const SBKEY = 'kopicatat_sb', DIRTY = 'kopicatat_dirty';
let sbCfg = (() => { try { return JSON.parse(localStorage.getItem(SBKEY)) || SB_DEFAULT; } catch (e) { return SB_DEFAULT; } })();
const sbOn = () => !!(sbCfg.url && sbCfg.key);
let sbState = 'off', sbErr = '', snap = {}, rev = 0, flushing = false, flushTimer = null;

const SQL_SETUP = `create table if not exists public.kopi_records (
  collection text not null,
  id text not null,
  data jsonb not null,
  updated_at timestamptz not null default now(),
  primary key (collection, id)
);

alter table public.kopi_records enable row level security;

drop policy if exists "kopi_anon_all" on public.kopi_records;
create policy "kopi_anon_all" on public.kopi_records
  for all to anon using (true) with check (true);`;

// stringify dengan urutan key tetap (jsonb di Postgres mengurutkan ulang key)
const canon = v => JSON.stringify(v, (k, val) => val && typeof val === 'object' && !Array.isArray(val)
  ? Object.keys(val).sort().reduce((o, key) => (o[key] = val[key], o), {}) : val);
const mapOf = d => { const m = {}; COLS.forEach(c => (d[c] || []).forEach(x => m[c + '/' + x.id] = canon(x))); return m; };
const splitKey = k => { const i = k.indexOf('/'); return [k.slice(0, i), k.slice(i + 1)]; };
const sameMap = (a, b) => { const ka = Object.keys(a); return ka.length === Object.keys(b).length && ka.every(k => a[k] === b[k]); };
function goTab(t) { const b = document.querySelector(`#nav button[data-t="${t}"]`); if (b) b.click(); }

function setSb(st, msg) {
  sbState = st; sbErr = msg || '';
  const ft = $('.side-foot');
  if (ft) ft.innerHTML = (st === 'off' ? ic('cloudoff', 14) : ic('cloudok', 14)) + '<span>' + (st === 'off' ? 'Belum tersambung ke cloud. Hubungkan di Pengaturan.' : st === 'err' ? 'Offline. Perubahan disimpan di perangkat dan dikirim saat tersambung.' : 'Data tersimpan di cloud.') + '</span>';
  const c = $('#sbchip');
  if (c) { c.innerHTML = { off: ic('cloudoff', 14) + 'Belum tersambung', ok: ic('cloudok', 14) + 'Tersinkron', sync: ic('sync', 14) + 'Sinkron…', err: ic('cloudoff', 14) + 'Offline, menunggu sinkron' }[st]; c.className = 'chip ' + st; }
  const ae = document.activeElement;
  if (tab === 'setting' && !(ae && ae.matches && ae.matches('input'))) render();
}

async function sbReq(method, path, body, extra) {
  const r = await fetch(sbCfg.url.replace(/\/+$/, '') + '/rest/v1/' + path, {
    method,
    headers: Object.assign({ apikey: sbCfg.key, Authorization: 'Bearer ' + sbCfg.key, 'Content-Type': 'application/json' }, extra || {}),
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) {
    let t = ''; try { t = (await r.json()).message || ''; } catch (e) { }
    throw new Error(t || ('HTTP ' + r.status));
  }
  return method === 'GET' ? r.json() : null;
}

async function sbPull() {
  const rows = []; let off = 0;
  for (; ;) {
    const part = await sbReq('GET', `kopi_records?select=collection,id,data&order=collection,id&limit=1000&offset=${off}`);
    rows.push(...part);
    if (part.length < 1000) break;
    off += 1000;
  }
  const r = empty();
  rows.forEach(x => { if (r[x.collection]) r[x.collection].push(x.data); });
  return r;
}

function queueSync() {
  if (!sbOn()) return;
  rev++; localStorage.setItem(DIRTY, '1');
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 500);
}

async function flush() {
  if (!sbOn()) return;
  if (flushing) { flushTimer = setTimeout(flush, 400); return; }
  flushing = true; const r0 = rev; setSb('sync');
  try {
    const cur = mapOf(db), ups = {}, dels = {};
    for (const k in cur) if (snap[k] !== cur[k]) { const [c, id] = splitKey(k); (ups[c] ||= []).push({ collection: c, id, data: JSON.parse(cur[k]), updated_at: new Date().toISOString() }); }
    for (const k in snap) if (!(k in cur)) { const [c, id] = splitKey(k); (dels[c] ||= []).push(id); }
    for (const c in ups) for (let i = 0; i < ups[c].length; i += 500)
      await sbReq('POST', 'kopi_records?on_conflict=collection,id', ups[c].slice(i, i + 500), { Prefer: 'resolution=merge-duplicates,return=minimal' });
    for (const c in dels) for (let i = 0; i < dels[c].length; i += 50)
      await sbReq('DELETE', `kopi_records?collection=eq.${c}&id=in.(${dels[c].slice(i, i + 50).join(',')})`);
    snap = cur;
    if (rev === r0) localStorage.removeItem(DIRTY);
    setSb('ok');
  } catch (e) {
    localStorage.setItem(DIRTY, '1'); setSb('err', e.message || String(e));
  } finally { flushing = false; }
}

// Tarik data dari cloud. merge: gabungkan data lokal yang belum tersinkron (sambungan pertama / habis offline)
async function sbSync(opts = {}) {
  if (!sbOn()) return setSb('off');
  setSb('sync');
  try {
    const remote = await sbPull(), rmap = mapOf(remote);
    const dirty = opts.merge || localStorage.getItem(DIRTY);
    let next = remote;
    if (dirty) {
      next = empty();
      COLS.forEach(c => {
        const local = db[c] || [], lids = new Set(local.map(x => x.id));
        next[c] = remote[c].filter(x => !lids.has(x.id)).concat(local);
      });
    }
    db = next; snap = rmap;
    localStorage.setItem(KEY, JSON.stringify(db));
    render();
    if (dirty) { localStorage.setItem(DIRTY, '1'); await flush(); } else setSb('ok');
  } catch (e) { setSb('err', e.message || String(e)); }
}

// Segarkan diam-diam saat tab dibuka lagi (mis. data diubah dari HP/perangkat lain)
async function sbRefresh() {
  if (!sbOn() || flushing || localStorage.getItem(DIRTY)) return;
  try {
    const remote = await sbPull(), rmap = mapOf(remote);
    if (flushing || localStorage.getItem(DIRTY) || sameMap(rmap, mapOf(db))) return;
    const ae = document.activeElement;
    if (ae && ae.matches && ae.matches('input,select')) return;
    db = remote; snap = rmap; localStorage.setItem(KEY, JSON.stringify(db)); render();
  } catch (e) { }
}
setInterval(() => { if (!document.hidden) sbRefresh(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sbRefresh(); });
window.addEventListener('online', () => { if (sbOn() && localStorage.getItem(DIRTY)) sbSync(); });

function vSetting() {
  const st = { off: 'Belum tersambung. Hubungkan database untuk mulai memakai aplikasi.', ok: 'Tersambung dan tersinkron.', sync: 'Menyinkronkan…', err: 'Gagal: ' + sbErr }[sbState];
  return `
  <div class="split top"><div class="card"><h2>Koneksi cloud</h2>
    <p style="margin:0 0 12px;font-size:14px" class="${sbState === 'ok' ? 'ok' : sbState === 'err' ? 'bad' : ''}"><b>${esc(st)}</b></p>
    <form onsubmit="saveSb(event)"><div class="grid two" style="gap:10px">
      <div><label>Alamat server</label><input name="url" type="password" autocomplete="off" placeholder="${sbOn() ? '•••••••• tersimpan, kosongkan bila tidak diubah' : 'https://alamat-server-anda'}" ${sbOn() ? '' : 'required'}></div>
      <div><label>Kunci akses</label><input name="key" type="password" autocomplete="off" placeholder="${sbOn() ? '•••••••• tersimpan, kosongkan bila tidak diubah' : 'Kunci akses'}" ${sbOn() ? '' : 'required'}></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn">Simpan &amp; sambungkan</button>
      ${sbOn() ? `<button type="button" class="btn alt" onclick="sbSync()">Sinkron sekarang</button><button type="button" class="btn alt" style="color:var(--bad);border-color:var(--bad)" onclick="disconnectSb()">Putuskan</button>` : ''}
    </div></form>
    <p class="hint">${ic('info', 14)}<span>Pertama kali tersambung, data lokal digabung ke database. Setelah itu setiap perubahan otomatis dikirim; jika offline, dikirim saat koneksi kembali.</span></p>
  </div>
  <div class="card"><h2>Setup database (sekali saja)</h2>
    <ol class="steps"><li>Siapkan database PostgreSQL cloud Anda.</li><li>Buka editor SQL, tempel SQL di bawah, lalu jalankan.</li><li>Ambil alamat server dan kunci akses dari pengaturan API, isi di atas.</li></ol>
    <div class="code">${esc(SQL_SETUP)}</div>
    <button class="btn alt" onclick="navigator.clipboard.writeText(SQL_SETUP).then(() => toast('SQL disalin'))">${ic('copy', 16)}Salin SQL</button>
    <p class="note">${ic('alert', 16)}<span><b>Perhatian:</b> aplikasi ini belum memakai login, jadi siapa pun yang memegang alamat server dan kunci akses bisa membaca dan mengubah data. Cukup untuk uji coba; tambahkan login sebelum dipakai sungguhan.</span></p>
  </div></div>`;
}
async function saveSb(e) {
  e.preventDefault(); const f = new FormData(e.target);
  const url = (f.get('url').trim() || sbCfg.url).replace(/\/+$/, ''), key = f.get('key').trim() || sbCfg.key;
  if (!/^https:\/\/.+/.test(url)) return alert('Alamat server harus diawali https://');
  sbCfg = { url, key }; localStorage.setItem(SBKEY, JSON.stringify(sbCfg));
  await sbSync({ merge: true });
  toast(sbState === 'ok' ? 'Tersambung ke cloud' : 'Gagal tersambung');
}
function disconnectSb() {
  if (!confirm('Putuskan koneksi cloud? Aplikasi tidak bisa dipakai sampai tersambung lagi. Data di cloud tetap aman.')) return;
  sbCfg = { url: '', key: '' }; localStorage.removeItem(SBKEY); localStorage.removeItem(DIRTY); snap = {};
  setSb('off'); render();
}

/* ---------- UTIL ---------- */
function del(tbl, id) {
  const msg = tbl === 'stok' ? 'Hapus bahan beserta riwayat geraknya?' : 'Hapus data ini?';
  if (!confirm(msg)) return;
  db[tbl] = db[tbl].filter(x => x.id !== id);
  if (tbl === 'stok') {
    db.gerak = db.gerak.filter(g => g.itemId !== id);
    db.menu.forEach(m => m.resep = (m.resep || []).filter(r => r.itemId !== id));
  }
  if (tbl === 'jual' || tbl === 'online') db.gerak = db.gerak.filter(g => g.ref !== id);
  if (tbl === 'karyawan') db.absen = db.absen.filter(a => a.karyawanId !== id);
  save(); render();
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Jenis', 'Tanggal', 'Menu/Kategori', 'Keterangan', 'Qty', 'Harga', 'Total', 'Bayar']];
  db.jual.filter(inMonth).forEach(x => rows.push(['Penjualan', x.tgl, x.menu, '', x.qty, x.harga, x.qty * x.harga, x.bayar]));
  db.keluar.filter(inMonth).forEach(x => rows.push(['Pengeluaran', x.tgl, x.kategori, x.ket, '', '', x.jumlah, '']));
  db.online.filter(o => inMonth(o) && o.status === 'Selesai').forEach(x => rows.push(['Online ' + x.platform, x.tgl, x.menu, x.noOrder, x.qty, x.harga, x.qty * x.harga, 'Online']));
  rows.sort((a, b) => (a[0] === 'Jenis' ? -1 : b[0] === 'Jenis' ? 1 : a[1].localeCompare(b[1])));
  download(`laporan-${bulan}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}
function backup() { download(`kopicatat-backup-${today()}.json`, JSON.stringify(db, null, 2), 'application/json'); }
function restore(inp) {
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!confirm('Data saat ini akan diganti. Lanjut?')) return;
      db = Object.assign(empty(), d); save(); render(); toast('Data dipulihkan');
    } catch (e) { alert('File backup tidak valid'); }
  };
  r.readAsText(f);
}
render();
enhanceTips();
setSb(sbOn() ? 'sync' : 'off');
if (sbOn()) sbSync();
</script>
